<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Signup Form</title>

<style>
/* ===== Page Style ===== */
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#b2c0d8,#1e3c72,#b2c0d8);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== Form Container ===== */
.container{
    background:#fff;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

/* ===== Input Fields ===== */
input, select{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

/* ===== Checkbox ===== */
.checkbox{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.checkbox input{
    width:auto;
    margin-right:8px;
}

/* ===== Button ===== */
button{
    width:100%;
    padding:12px;
    background:#2a5298;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e3c72;
}

/* ===== Error Message ===== */
.error{
    color:red;
    font-size:13px;
    margin-bottom:10px;
}
.success{
    color:green;
    text-align:center;
    margin-top:10px;
}
.footer{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<h2>Signup Form</h2>

<form id="signupForm">

<label>Username</label>
<input type="text" placeholder="Enter username" id="username" required>

<label>Email</label>
<input type="email" placeholder="Enter email" id="email" required>

<label>Password</label>
<input type="password" placeholder="Enter password" id="password" required>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm password" id="confirm_password" required>

<label>Role</label>
<select id="role" required>
    <option value="">Select role</option>
    <option>SHIPPER</option>
    <option>CARRIER</option>
    <option>DRIVER</option>
</select>

<div class="checkbox">
    <input type="checkbox" id="terms">
    <label>I accept the terms & conditions</label>
</div>

<div id="error" class="error"></div>

<button type="submit">Create Account</button>

<div id="success" class="success"></div>

</form>


<script>
// ===== Form Validation =====
document.getElementById("signupForm").addEventListener("submit", function(e){

    e.preventDefault();

    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirm_password").value;
    let role = document.getElementById("role").value;
    let terms = document.getElementById("terms").checked;

    let error = document.getElementById("error");
    let success = document.getElementById("success");

    error.textContent = "";
    success.textContent = "";

    // Username validation
    if(username.length < 3){
        error.textContent = "Username must be at least 3 characters.";
        return;
    }

    // Password match validation
    if(password !== confirmPassword){
        error.textContent = "Passwords do not match.";
        return;
    }

    // Password strength
    if(password.length < 6){
        error.textContent = "Password must be at least 6 characters.";
        return;
    }

    // Role selection
    if(role === ""){
        error.textContent = "Please select a role.";
        return;
    }

    // Terms checkbox
    if(!terms){
        error.textContent = "You must accept terms & conditions.";
        return;
    }

    // Success message
    success.textContent = "Account created successfully!";

});
</script>

</body>
</html>
